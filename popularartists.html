<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Artists</title>
    <link rel="stylesheet" href="./css/popularartists.css">
</head>
<body>

<div class="container">

<div class="section-header">
        <h2 class="title">
            Popular <span>Artists</span><br>
            On This Week
        </h2>
        <button class="see-all">See All</button>
    </div>

    <div class="artists-grid">

        <div class="artist1-card">
            <img src="./images/Rectangle 9675.svg" alt="">
            <div class="avatar">
                <img src="./images/person/Ellipse 6.svg">
            </div>
            <div class="artist-info">
                <div class="role">Owner</div>
                <div class="name">Osvaldo Percy</div>
            </div>
        </div>

        <div class="artist2-card">
            <img src="./images/Rectangle 9677.svg" alt="">
            <div class="avatar">
                <img src="./images/person/Ellipse 6 (1).svg">
            </div>
            <div class="artist-info">
                <div class="role">Owner</div>
                <div class="name">Ranson Squire</div>
            </div>
        </div>

        <div class="artist3-card">
            <img src="./images/Rectangle 9674.svg" alt="">
            <div class="avatar">
                <img src="./images/person/Ellipse 6 (4).svg" class="leo">
            </div>
            <div class="artist-info">
                <div class="role">Owner</div>
                <div class="name">Cristio Leo</div>
            </div>
        </div>

        <div class="artist4-card">
            <img src="./images/Rectangle 1000.svg" alt="">
            <div class="avatar">
                <img src="./images/person/Ellipse 6 (2).svg">
            </div>
            <div class="artist-info">
                <div class="role">Owner</div>
                <div class="name">Sebastian Waltan</div>
            </div>
        </div>

        <div class="artist5-card">
            <img src="./images/Rectangle 9678.svg" alt="">
            <div class="avatar">
                <img src="./images/person/Ellipse 6 (3).svg">
            </div>
            <div class="artist-info">
                <div class="role">Owner</div>
                <div class="name">Abraham Zack</div>
            </div>
        </div>


    </div>

</div>

</body>
</html>
